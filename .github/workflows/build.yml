name: Build module
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cek syntax script
        run: for f in install.sh UNLOCKER apply.sh common/*.sh; do sh -n "$f" || exit 1; done
      - name: Package
        id: pkg
        run: |
          ID=$(grep '^id=' module.prop | cut -d= -f2)
          VER=$(grep '^version=' module.prop | cut -d= -f2)
          ZIP="$ID-$VER.zip"
          zip -r9 "$ZIP" . -x '.git/*' '.github/*' '.gitignore' 'README.md' '*.zip'
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.zip }}
          path: ${{ steps.pkg.outputs.zip }}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pkg.outputs.zip }}
