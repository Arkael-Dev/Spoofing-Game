name: Build module
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cek syntax script
        run: for f in install.sh UNLOCKER apply.sh detect.sh downscale.sh common/*.sh; do sh -n "$f" || exit 1; done
      - name: Build Zygisk hook (release)
        run: bash native/build.sh
      - name: Package
        id: pkg
        run: |
          ID=$(grep '^id=' module.prop | cut -d= -f2)
          VER=$(grep '^version=' module.prop | cut -d= -f2)
          CODE=$(grep '^versionCode=' module.prop | cut -d= -f2)
          ZIP="$ID-$VER.zip"
          zip -r9 "$ZIP" . -x '.git/*' '.github/*' '.gitignore' 'README.md' 'update.json' 'native/*' '*.zip'
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
      - name: Build Zygisk hook (debug, logs to logcat tag SpoofGame)
        run: bash native/build.sh debug
      - name: Package debug
        id: dbg
        run: |
          ID=$(grep '^id=' module.prop | cut -d= -f2)
          VER=$(grep '^version=' module.prop | cut -d= -f2)
          ZIP="$ID-$VER-debug.zip"
          rm -rf /tmp/dbg && mkdir /tmp/dbg
          tar --exclude=./.git --exclude=./.github --exclude=./.gitignore --exclude=./README.md \
              --exclude=./update.json --exclude=./native --exclude='./*.zip' -cf - . | tar -xf - -C /tmp/dbg
          sed -i 's/^name=.*/& [DEBUG]/; s/^version=.*/&-debug/; /^updateJson=/d' /tmp/dbg/module.prop
          (cd /tmp/dbg && zip -r9 "$GITHUB_WORKSPACE/$ZIP" .)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.zip }}
          path: ${{ steps.pkg.outputs.zip }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dbg.outputs.zip }}
          path: ${{ steps.dbg.outputs.zip }}
      # Tag with a dash (v1.8-beta1, v1.8-rc1) = pre-release. Tag without a dash (v1.8) = full release.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pkg.outputs.zip }}
            ${{ steps.dbg.outputs.zip }}
          prerelease: ${{ contains(github.ref_name, '-') }}
      # update.json only for full releases, so a pre-release never reaches update prompts.
      - name: Update update.json
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        run: |
          git fetch origin main
          git checkout -f main
          printf '{\n  "version": "%s",\n  "versionCode": %s,\n  "zipUrl": "https://github.com/${{ github.repository }}/releases/download/%s/%s",\n  "changelog": "https://raw.githubusercontent.com/${{ github.repository }}/main/CHANGELOG.md"\n}\n' "${{ steps.pkg.outputs.ver }}" "${{ steps.pkg.outputs.code }}" "$GITHUB_REF_NAME" "${{ steps.pkg.outputs.zip }}" > update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --cached --quiet || (git commit -m "update.json ${{ steps.pkg.outputs.ver }}" && git push origin main)
