<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spoofing Game</title>
<style>
:root{--bg:#f2f4f9;--card:#fff;--ink:#141a2e;--mut:#59627f;--line:#d9deeb;--acc:#ffc400;--onacc:#141a2e;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#121a2b;--card:#1a2440;--ink:#eaf0ff;--mut:#93a0c4;--line:#2c3860;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(20px,env(safe-area-inset-top)) 18px 40px}
main{max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:start;gap:12px}
h1{font-size:28px;letter-spacing:-.02em;margin:6px 0 2px;font-weight:800}
.by{color:var(--mut);margin:0 0 20px;font-size:14px}
#lang{font:inherit;font-weight:700;font-size:14px;padding:7px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);margin-top:8px}
.plate{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:6px;padding:14px 16px;margin-bottom:12px}
.plate small{color:var(--mut);display:block;font-size:13px}
.plate b{display:block;font-size:22px;letter-spacing:.01em}
.row{display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap}
.state{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--line);color:var(--ink)}
.state.on{background:var(--acc);color:var(--onacc)}
h2{font-size:15px;margin:22px 0 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{font:inherit;font-weight:600;padding:9px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
label{display:block;margin:0 0 12px;font-size:14px;color:var(--mut)}
input,select,textarea{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:6px;padding:11px 12px}
textarea{min-height:110px;resize:vertical;font-size:14px}
input:focus,select:focus,textarea:focus,.chip:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sw{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:6px 0 14px;color:var(--ink);font-size:15px}
.sw input{width:22px;height:22px;margin:0;accent-color:#c99700}
.go{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:6px;background:var(--acc);color:var(--onacc);margin-top:6px}
.ghost{width:100%;font:inherit;font-weight:600;padding:12px;margin-top:10px;border:1.5px solid var(--line);border-radius:6px;background:transparent;color:var(--ink)}
.note{color:var(--mut);font-size:13px;margin:10px 0 0}
.app{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:0 0 6px;font-size:13px}.app .pk{word-break:break-all}.app select{width:auto;margin:0;padding:6px 8px;font-size:14px}.app input[type=checkbox]{width:22px;height:22px;margin:0;accent-color:#c99700}.grp{color:var(--mut);font-size:13px;margin:12px 0 6px}
#toast{position:fixed;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom));max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:6px;font-size:14px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
#toast.show{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<main>
<div class="top"><div><h1>Spoofing Game</h1><p class="by">Arkael-Dev</p></div><button id="lang" aria-label="Language">ID | EN</button></div>

<section class="plate" aria-live="polite">
  <div class="row"><div><small data-t="now"></small><b id="curName">…</b><small id="curMeta"></small><small id="curGpu"></small></div><span id="state" class="state"></span></div>
</section>
<button class="ghost" id="fromNow" style="margin:0 0 6px" data-t="fromNow"></button>

<h2 data-t="target"></h2>
<div class="chips" id="chips"></div>

<label><span data-t="name"></span><input id="MARKET" autocomplete="off"></label>
<label><span data-t="model"></span><input id="MODEL" autocomplete="off" autocapitalize="characters"></label>
<div class="two">
  <label><span data-t="brand"></span><input id="BRAND" autocomplete="off"></label>
  <label><span data-t="mfr"></span><input id="MFR" autocomplete="off"></label>
</div>
<label><span data-t="socCode"></span><input id="SOC" autocomplete="off"></label>
<label><span data-t="socName"></span><input id="SOCNAME" autocomplete="off"></label>

<h2 data-t="gpuTitle"></h2>
<label class="sw" for="GPU_ENABLED"><span data-t="gpuOn"></span><input type="checkbox" id="GPU_ENABLED"></label>
<label><span data-t="gpuName"></span><input id="GPU_RENDERER" autocomplete="off"></label>
<label><span data-t="gpuVendor"></span><input id="GPU_VENDOR" autocomplete="off"></label>
<label><span data-t="gpuApps"></span><textarea id="GPU_APPS" autocapitalize="none" spellcheck="false"></textarea></label>
<p class="note" data-t="gpuNote"></p>

<h2 data-t="appsTitle"></h2>
<label class="sw" for="GPU_AUTO"><span data-t="autoOn"></span><input type="checkbox" id="GPU_AUTO"></label>
<button class="ghost" id="detect" style="margin:0 0 6px" data-t="detect"></button>
<div class="grp" data-t="listed"></div>
<div id="apps"></div>
<label style="margin-top:12px"><span data-t="searchApps"></span><input id="q" autocomplete="off" autocapitalize="none" spellcheck="false"></label>
<div id="found"></div>
<p class="note" data-t="appsNote"></p>

<h2 data-t="display"></h2>
<label><span data-t="refresh"></span>
  <select id="REFRESH"><option>60</option><option>90</option><option>120</option><option>144</option></select>
</label>
<label class="sw" for="ENABLED"><span data-t="spoofOn"></span><input type="checkbox" id="ENABLED"></label>

<button class="go" id="save" data-t="save"></button>
<button class="ghost" id="reset" data-t="reset"></button>
<p class="note" data-t="note"></p>
</main>
<div id="toast" role="status"></div>

<script>
const MOD='/data/adb/modules/Spoofing';
const KEYS=['MARKET','MODEL','BRAND','MFR','SOC','SOCNAME','GPU_RENDERER','GPU_VENDOR'];
const PRESETS={f8u:{label:'POCO F8 Ultra',MARKET:'POCO F8 Ultra',MODEL:'25102PCBEG',BRAND:'POCO',MFR:'Xiaomi',SOC:'SM8850',SOCNAME:'Snapdragon 8 Elite Gen 5',GPU_RENDERER:'Adreno (TM) 840',GPU_VENDOR:'Qualcomm'},f9u:{label:'POCO F9 Ultra',MARKET:'POCO F9 Ultra',MODEL:'26077PC53G',BRAND:'POCO',MFR:'Xiaomi',SOC:'SM8850',SOCNAME:'Snapdragon 8 Elite Gen 5',GPU_RENDERER:'Adreno (TM) 840',GPU_VENDOR:'Qualcomm'}};
const T={
id:{now:'Perangkat terbaca sistem sekarang',gpuReal:'GPU asli',on:'spoof aktif',off:'belum aktif',fromNow:'Isi dari nilai terbaca',target:'Perangkat tujuan',custom:'Kustom',name:'Nama perangkat',model:'Kode model',brand:'Brand',mfr:'Produsen',socCode:'Kode SoC (chipset)',socName:'Nama SoC',gpuTitle:'Spoof GPU',gpuOn:'Spoof GPU aktif',gpuName:'Nama GPU (GL_RENDERER)',gpuVendor:'Vendor GPU',gpuApps:'Paket game, satu per baris',appsTitle:'Aplikasi: spoof GPU & downscale',autoOn:'Deteksi game otomatis saat boot',detect:'Deteksi game terpasang',listed:'Terdeteksi / dipilih',searchApps:'Cari aplikasi terpasang (min. 2 huruf)',downscale:'Downscale',dsOff:'Off',tool:'alat uji',empty:'Belum ada game dikenal yang terdeteksi.',found:'Terdeteksi: ',appsNote:'Centang = spoof GPU untuk aplikasi itu. Downscale menurunkan resolusi render per aplikasi lewat Game Mode Android (cmd game), efeknya tergantung ROM dan game. Game yang tidak dikenal: cari lalu centang.',gpuNote:'Perlu Zygisk. Hanya berlaku untuk game di daftar. Aktif saat game dibuka lagi, tanpa reboot.',display:'Layar dan status',refresh:'Refresh rate (Hz)',spoofOn:'Spoof aktif',save:'Simpan dan terapkan',reset:'Kembalikan ke bawaan modul',note:'Setelah disimpan, tutup paksa game lalu buka lagi. Reboot sekali supaya semua proses memakai nilai baru. Mematikan spoof baru kembali ke nilai asli setelah reboot.',saved:'Tersimpan. Tutup paksa game lalu buka lagi.',fail:'Gagal: ',need:'Isi nama perangkat dan kode model dulu.',resetOk:'Dikembalikan ke bawaan modul.',filled:'Nilai terbaca sudah diisi. Ubah sesuai keinginan lalu simpan.',noKsu:'Buka dari KSU Next > Modul > WebUI',unknown:'tidak terbaca'},
en:{now:'Device as read by the system now',gpuReal:'Real GPU',on:'spoof active',off:'not active',fromNow:'Fill from current values',target:'Target device',custom:'Custom',name:'Device name',model:'Model code',brand:'Brand',mfr:'Manufacturer',socCode:'SoC code (chipset)',socName:'SoC name',gpuTitle:'GPU spoof',gpuOn:'GPU spoof enabled',gpuName:'GPU name (GL_RENDERER)',gpuVendor:'GPU vendor',gpuApps:'Game packages, one per line',appsTitle:'Apps: GPU spoof & downscale',autoOn:'Auto-detect games at boot',detect:'Detect installed games',listed:'Detected / selected',searchApps:'Search installed apps (min. 2 letters)',downscale:'Downscale',dsOff:'Off',tool:'test tool',empty:'No known games detected yet.',found:'Detected: ',appsNote:'Checked = GPU spoof for that app. Downscale lowers the render resolution per app through Android Game Mode (cmd game); the effect depends on ROM and game. Unknown games: search, then check them.',gpuNote:'Requires Zygisk. Only applies to the listed games. Takes effect the next time a game starts, no reboot needed.',display:'Display and status',refresh:'Refresh rate (Hz)',spoofOn:'Spoof enabled',save:'Save and apply',reset:'Reset to module defaults',note:'After saving, force-stop the game and reopen it. Reboot once so every process uses the new values. Turning spoof off restores the real values only after a reboot.',saved:'Saved. Force-stop the game and reopen it.',fail:'Failed: ',need:'Enter a device name and model code first.',resetOk:'Reset to module defaults.',filled:'Current values filled in. Edit them, then save.',noKsu:'Open from KSU Next > Modules > WebUI',unknown:'unreadable'}
};
let lang='id';try{lang=localStorage.getItem('lang')||(navigator.language||'').slice(0,2)==='id'?'id':'en';const s=localStorage.getItem('lang');if(s)lang=s}catch(e){lang=(navigator.language||'').slice(0,2)==='id'?'id':'en'}
const $=s=>document.querySelector(s);
const t=k=>T[lang][k]||k;
const clean=v=>String(v).replace(/[^A-Za-z0-9 ._+()-]/g,'').trim();
const cleanApps=v=>String(v).split(/[\s,]+/).map(x=>x.replace(/[^A-Za-z0-9._-]/g,'')).filter(Boolean).join(',');
let cur={},det={games:[],tools:[]},all=[],ds={};
const DSV=['1','0.9','0.8','0.7','0.6','0.5','0.4'];
const gpuSet=()=>new Set(cleanApps($('#GPU_APPS').value).split(',').filter(Boolean));
function setGpu(p,on){const s=gpuSet();if(on)s.add(p);else s.delete(p);$('#GPU_APPS').value=[...s].join('\n')}
function rowEl(p){
  const d=document.createElement('div');d.className='app';
  const n=document.createElement('span');n.className='pk';n.textContent=p+(det.tools.includes(p)?' · '+t('tool'):'');
  const c=document.createElement('input');c.type='checkbox';c.checked=gpuSet().has(p);c.setAttribute('aria-label','GPU '+p);c.onchange=()=>setGpu(p,c.checked);
  const s=document.createElement('select');s.setAttribute('aria-label',t('downscale')+' '+p);
  DSV.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v==='1'?t('dsOff'):Math.round(v*100)+'%';s.appendChild(o)});
  s.value=ds[p]||'1';s.onchange=()=>{if(s.value==='1')delete ds[p];else ds[p]=s.value};
  d.append(n,c,s);return d;
}
function shownList(){return [...new Set([...det.games,...det.tools,...gpuSet(),...Object.keys(ds)])]}
function renderApps(){
  const box=$('#apps');if(!box)return;box.textContent='';
  const l=shownList();
  if(!l.length){const e=document.createElement('p');e.className='note';e.textContent=t('empty');box.appendChild(e)}
  l.forEach(p=>box.appendChild(rowEl(p)));
  renderFound();
}
function renderFound(){
  const box=$('#found');box.textContent='';
  const q=$('#q').value.trim().toLowerCase();if(q.length<2)return;
  const sh=new Set(shownList());
  all.filter(p=>p.toLowerCase().includes(q)&&!sh.has(p)).slice(0,30).forEach(p=>box.appendChild(rowEl(p)));
}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  showCur();renderApps();
}
function run(cmd){
  return new Promise(res=>{
    if(!window.ksu||!ksu.exec){res({code:-1,out:'',err:t('noKsu')});return}
    const cb='cb_'+Date.now()+Math.random().toString(36).slice(2);
    window[cb]=(code,out,err)=>{delete window[cb];res({code,out:out||'',err:err||''})};
    try{ksu.exec(cmd,'{}',cb)}catch(e){delete window[cb];res({code:-1,out:'',err:String(e)})}
  });
}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),4500)}
function parse(txt){const o={};txt.split('\n').forEach(l=>{const m=l.match(/^(\w+)="(.*)"$/);if(m)o[m[1]]=m[2]});return o}
function mark(){
  const v=KEYS.map(k=>$('#'+k).value).join('|');
  const hit=Object.keys(PRESETS).find(id=>KEYS.map(k=>PRESETS[id][k]).join('|')===v)||'custom';
  document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===hit)));
}
function fill(c){
  KEYS.forEach(k=>$('#'+k).value=c[k]||'');
  $('#GPU_APPS').value=(c.GPU_APPS||'').split(',').filter(Boolean).join('\n');
  $('#REFRESH').value=c.REFRESH||'120';
  $('#ENABLED').checked=c.ENABLED!=='0';
  $('#GPU_ENABLED').checked=c.GPU_ENABLED!=='0';
  $('#GPU_AUTO').checked=c.GPU_AUTO!=='0';
  ds={};(c.DOWNSCALE||'').split(',').forEach(e=>{const i=e.indexOf('=');if(i>0){const p=e.slice(0,i).replace(/[^A-Za-z0-9._]/g,''),r=e.slice(i+1);if(p&&DSV.includes(r)&&r!=='1')ds[p]=r}});
  renderApps();mark();
}
function showCur(){
  $('#curName').textContent=cur.name||cur.model||t('unknown');
  $('#curMeta').textContent=[cur.model,cur.soc].filter(Boolean).join(' · ');
  $('#curGpu').textContent=cur.gpu?t('gpuReal')+': '+cur.gpu:'';
  const on=cur.model&&cur.model===clean($('#MODEL').value)&&$('#ENABLED').checked;
  const st=$('#state');st.textContent=on?t('on'):t('off');st.classList.toggle('on',!!on);
}
async function status(){
  const r=await run('getprop ro.product.model; getprop ro.product.marketname; getprop ro.soc.model; getprop ro.product.brand; getprop ro.product.manufacturer; dumpsys SurfaceFlinger 2>/dev/null | grep -m1 "^GLES:"');
  const L=r.out.split('\n');
  cur={model:L[0],name:L[1],soc:L[2],brand:L[3],mfr:L[4],gpu:'',vendor:''};
  const g=(L[5]||'').replace(/^GLES:\s*/,'').split(', ');
  if(g.length>=2){cur.vendor=g[0];cur.gpu=g[1]}
  showCur();
}
async function detect(){
  const r=await run('sh '+MOD+'/detect.sh');
  det={games:[],tools:[]};
  r.out.split('\n').forEach(l=>{const m=l.trim().match(/^([GT]):([A-Za-z0-9._]+)$/);if(m)(m[1]==='G'?det.games:det.tools).push(m[2])});
  det.games.forEach(p=>setGpu(p,true));
  renderApps();toast(det.games.length?t('found')+det.games.length:t('empty'));
}
async function listApps(){
  const r=await run('pm list packages -3');
  all=r.out.split('\n').map(l=>l.trim().replace(/^package:/,'')).filter(p=>/^[A-Za-z0-9._]+$/.test(p)).sort();
  renderFound();
}
async function load(){
  const r=await run('cat '+MOD+'/config.conf');
  if(r.code!==0){toast(r.err||t('fail'));}else fill(parse(r.out));
  status();
  const d=await run('sh '+MOD+'/detect.sh');
  d.out.split('\n').forEach(l=>{const m=l.trim().match(/^([GT]):([A-Za-z0-9._]+)$/);if(m&&!det[m[1]==='G'?'games':'tools'].includes(m[2]))det[m[1]==='G'?'games':'tools'].push(m[2])});
  renderApps();listApps();
}
async function save(){
  const c={ENABLED:$('#ENABLED').checked?'1':'0',GPU_ENABLED:$('#GPU_ENABLED').checked?'1':'0',REFRESH:$('#REFRESH').value,GLES:'196610',GPU_APPS:cleanApps($('#GPU_APPS').value),GPU_AUTO:$('#GPU_AUTO').checked?'1':'0',DOWNSCALE:Object.entries(ds).map(([p,r])=>p.replace(/[^A-Za-z0-9._]/g,'')+'='+r).join(',')};
  KEYS.forEach(k=>c[k]=clean($('#'+k).value));
  if(!c.MARKET||!c.MODEL){toast(t('need'));return}
  const args=Object.entries(c).map(([k,v])=>`'${k}="${v}"'`).join(' ');
  const r=await run(`printf '%s\\n' ${args} > ${MOD}/config.conf && sh ${MOD}/apply.sh && sh ${MOD}/downscale.sh`);
  toast(r.code===0?t('saved'):t('fail')+(r.err||r.code));
  fill(c);status();
}
async function reset(){
  const r=await run(`cp -f ${MOD}/config.default ${MOD}/config.conf && sh ${MOD}/apply.sh`);
  if(r.code===0){toast(t('resetOk'));load()}else toast(t('fail')+(r.err||r.code));
}
function fromNow(){
  const m={MARKET:cur.name||cur.model,MODEL:cur.model,BRAND:cur.brand,MFR:cur.mfr,SOC:cur.soc,GPU_RENDERER:cur.gpu,GPU_VENDOR:cur.vendor};
  Object.entries(m).forEach(([k,v])=>{if(v)$('#'+k).value=v});mark();toast(t('filled'));
}
const box=$('#chips');
Object.entries(PRESETS).concat([['custom',{}]]).forEach(([id,p])=>{
  const b=document.createElement('button');b.className='chip';b.dataset.id=id;
  if(id==='custom')b.dataset.t='custom';else b.textContent=p.label;
  b.onclick=()=>{if(id==='custom'){$('#MODEL').focus();return}KEYS.forEach(k=>$('#'+k).value=p[k]);mark()};
  box.appendChild(b);
});
KEYS.forEach(k=>$('#'+k).addEventListener('input',mark));
$('#detect').onclick=detect;$('#q').addEventListener('input',renderFound);
$('#save').onclick=save;$('#reset').onclick=reset;$('#fromNow').onclick=fromNow;
$('#lang').onclick=()=>{lang=lang==='id'?'en':'id';try{localStorage.setItem('lang',lang)}catch(e){}applyLang()};
applyLang();load();
</script>
</body>
</html>
