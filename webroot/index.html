<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spoofing Game</title>
<style>
:root{--bg:#f2f4f9;--card:#fff;--ink:#141a2e;--mut:#59627f;--line:#d9deeb;--acc:#ffc400;--onacc:#141a2e;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#121a2b;--card:#1a2440;--ink:#eaf0ff;--mut:#93a0c4;--line:#2c3860;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(20px,env(safe-area-inset-top)) 18px 40px}
main{max-width:560px;margin:0 auto}
h1{font-size:28px;letter-spacing:-.02em;margin:6px 0 2px;font-weight:800}
.by{color:var(--mut);margin:0 0 20px;font-size:14px}
.plate{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:6px;padding:14px 16px;margin-bottom:22px}
.plate small{color:var(--mut);display:block;font-size:13px}
.plate b{display:block;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.plate .row{display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap}
.state{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--line);color:var(--ink)}
.state.on{background:var(--acc);color:var(--onacc)}
h2{font-size:15px;margin:0 0 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{font:inherit;font-weight:600;padding:9px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
label{display:block;margin:0 0 12px;font-size:14px;color:var(--mut)}
input,select{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:6px;padding:11px 12px}
input:focus,select:focus,.chip:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sw{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:6px 0 18px;color:var(--ink);font-size:15px}
.sw input{width:22px;height:22px;margin:0;accent-color:#c99700}
.go{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:6px;background:var(--acc);color:var(--onacc)}
.ghost{width:100%;font:inherit;font-weight:600;padding:12px;margin-top:10px;border:1.5px solid var(--line);border-radius:6px;background:transparent;color:var(--ink)}
.note{color:var(--mut);font-size:13px;margin:14px 0 0}
#toast{position:fixed;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom));max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:6px;font-size:14px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
#toast.show{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<main>
<h1>Spoofing Game</h1>
<p class="by">Arkael-Dev</p>

<section class="plate" aria-live="polite">
  <div class="row"><div><small>Perangkat terbaca sistem sekarang</small><b id="curName">…</b><small id="curMeta"></small></div><span id="state" class="state">memeriksa</span></div>
</section>

<h2>Perangkat tujuan</h2>
<div class="chips" id="chips"></div>

<label>Nama perangkat<input id="MARKET" autocomplete="off"></label>
<label>Kode model<input id="MODEL" autocomplete="off" autocapitalize="characters"></label>
<div class="two">
  <label>Brand<input id="BRAND" autocomplete="off"></label>
  <label>Produsen<input id="MFR" autocomplete="off"></label>
</div>
<div class="two">
  <label>Kode SoC<input id="SOC" autocomplete="off"></label>
  <label>Nama SoC<input id="SOCNAME" autocomplete="off"></label>
</div>
<label>Refresh rate (Hz)
  <select id="REFRESH"><option>60</option><option>90</option><option>120</option><option>144</option></select>
</label>

<label class="sw" for="ENABLED">Spoof aktif<input type="checkbox" id="ENABLED"></label>

<button class="go" id="save">Simpan dan terapkan</button>
<button class="ghost" id="reset">Kembalikan ke bawaan modul</button>
<p class="note">Setelah disimpan, tutup paksa game lalu buka lagi. Reboot sekali supaya semua proses memakai nilai baru. Mematikan spoof baru kembali ke nilai asli setelah reboot.</p>
</main>
<div id="toast" role="status"></div>

<script>
const MOD='/data/adb/modules/Spoofing';
const KEYS=['MARKET','MODEL','BRAND','MFR','SOC','SOCNAME'];
const PRESETS={
  f9u:{label:'POCO F9 Ultra',MARKET:'POCO F9 Ultra',MODEL:'26077PC53G',BRAND:'POCO',MFR:'Xiaomi',SOC:'SM8850',SOCNAME:'Snapdragon 8 Elite Gen 5'}
};
const $=s=>document.querySelector(s);
const clean=v=>String(v).replace(/[^A-Za-z0-9 ._+-]/g,'').trim();

function run(cmd){
  return new Promise(res=>{
    if(!window.ksu||!ksu.exec){res({code:-1,out:'',err:'Buka halaman ini dari KSU Next > Modul > WebUI'});return}
    const cb='cb_'+Date.now()+Math.random().toString(36).slice(2);
    window[cb]=(code,out,err)=>{delete window[cb];res({code,out:out||'',err:err||''})};
    try{ksu.exec(cmd,'{}',cb)}catch(e){delete window[cb];res({code:-1,out:'',err:String(e)})}
  });
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),4500)}

function parse(txt){const o={};txt.split('\n').forEach(l=>{const m=l.match(/^(\w+)="(.*)"$/);if(m)o[m[1]]=m[2]});return o}
function mark(){
  const cur=KEYS.map(k=>$('#'+k).value).join('|');
  const hit=Object.keys(PRESETS).find(id=>KEYS.map(k=>PRESETS[id][k]).join('|')===cur)||'custom';
  document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===hit)));
}
function fill(c){
  KEYS.forEach(k=>$('#'+k).value=c[k]||'');
  $('#REFRESH').value=c.REFRESH||'120';
  $('#ENABLED').checked=c.ENABLED!=='0';
  mark();
}
async function load(){
  const r=await run('cat '+MOD+'/config.conf');
  if(r.code!==0){toast(r.err||'Config belum terbaca');return}
  window.cfg=parse(r.out);fill(window.cfg);status();
}
async function status(){
  const r=await run('getprop ro.product.model; getprop ro.product.marketname; getprop ro.soc.model');
  const [m,n,s]=r.out.split('\n');
  $('#curName').textContent=n||m||'tidak terbaca';
  $('#curMeta').textContent=[m,s].filter(Boolean).join(' · ');
  const on=m&&m===clean($('#MODEL').value)&&$('#ENABLED').checked;
  const st=$('#state');st.textContent=on?'spoof aktif':'belum aktif';st.classList.toggle('on',!!on);
}
async function save(){
  const c={ENABLED:$('#ENABLED').checked?'1':'0',REFRESH:$('#REFRESH').value,GLES:'196610'};
  KEYS.forEach(k=>c[k]=clean($('#'+k).value));
  if(!c.MARKET||!c.MODEL){toast('Isi nama perangkat dan kode model dulu.');return}
  const args=Object.entries(c).map(([k,v])=>`'${k}="${v}"'`).join(' ');
  const r=await run(`printf '%s\\n' ${args} > ${MOD}/config.conf && sh ${MOD}/apply.sh`);
  toast(r.code===0?'Tersimpan. Tutup paksa game lalu buka lagi.':'Gagal menyimpan: '+(r.err||r.code));
  fill(c);status();
}
async function reset(){
  const r=await run(`cp -f ${MOD}/config.default ${MOD}/config.conf && sh ${MOD}/apply.sh`);
  if(r.code===0){toast('Dikembalikan ke bawaan modul.');load()}else toast('Gagal: '+(r.err||r.code));
}

const box=$('#chips');
Object.entries(PRESETS).concat([['custom',{label:'Kustom'}]]).forEach(([id,p])=>{
  const b=document.createElement('button');b.className='chip';b.dataset.id=id;b.textContent=p.label;
  b.onclick=()=>{if(id==='custom'){$('#MODEL').focus();return}KEYS.forEach(k=>$('#'+k).value=p[k]);mark()};
  box.appendChild(b);
});
KEYS.forEach(k=>$('#'+k).addEventListener('input',mark));
$('#save').onclick=save;$('#reset').onclick=reset;
load();
</script>
</body>
</html>
